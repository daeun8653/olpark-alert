name: daily-alert

on:
  schedule:
    - cron: "7 9 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py daily
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
